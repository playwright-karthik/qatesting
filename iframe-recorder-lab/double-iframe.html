  &lt;script&gt;
    const status = document.getElementById(&#x27;status&#x27;);
    const viewFlag = document.getElementById(&#x27;view-flag&#x27;);
    const params = new URLSearchParams(window.location.search);
    viewFlag.textContent = params.get(&#x27;view&#x27;) || &#x27;right&#x27;;
    document.getElementById(&#x27;fixture-title&#x27;).textContent = params.get(&#x27;label&#x27;) || &#x27;Right Iframe Fixture&#x27;;
    document.getElementById(&#x27;fixture-subtitle&#x27;).textContent = params.get(&#x27;subtitle&#x27;) || &#x27;This iframe is the right-side fixture for recorder testing.&#x27;;
    const mark = (message) =&gt; { status.textContent = message; };
    document.getElementById(&#x27;action-button&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; mark(&#x27;Button clicked&#x27;));
    document.getElementById(&#x27;checkbox-input&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; mark(&#x27;Checkbox changed: &#x27; + event.target.checked));
    document.getElementById(&#x27;radio-one&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; { if (event.target.checked) mark(&#x27;Radio one selected&#x27;); });
    document.getElementById(&#x27;radio-two&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; { if (event.target.checked) mark(&#x27;Radio two selected&#x27;); });
    document.getElementById(&#x27;select-input&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; mark(&#x27;Select changed: &#x27; + event.target.value));
    document.getElementById(&#x27;text-input&#x27;).addEventListener(&#x27;input&#x27;, (event) =&gt; mark(&#x27;Text input: &#x27; + event.target.value));
    document.getElementById(&#x27;password-input&#x27;).addEventListener(&#x27;input&#x27;, (event) =&gt; mark(&#x27;Password input length: &#x27; + event.target.value.length));
    document.getElementById(&#x27;textarea-input&#x27;).addEventListener(&#x27;input&#x27;, (event) =&gt; mark(&#x27;Textarea length: &#x27; + event.target.value.length));
