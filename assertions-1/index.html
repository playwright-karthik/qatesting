<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playwright Assertion Practice</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #263238; background: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 16px 48px; }
    main { max-width: 920px; margin: auto; }
    body > h1.page-title.h3 { position: absolute; left: -10000px; top: 0; margin: 0; }
    h2 { margin: 28px 0 14px; font-size: 20px; }
    .panel { margin: 18px 0; padding: 20px; background: #fff; border: 1px solid #d7dee7; border-radius: 8px; }
    .field { margin: 0 0 14px; }
    label { display: block; margin-bottom: 6px; }
    input.form-control, input.practice-input {
      display: block; width: 100%; height: 38px; padding: 8px 11px;
      border: 1px solid #aeb9c6; border-radius: 4px; background: #fff; font-size: 14px;
    }
    input:disabled { background: #e9edf2; }
    input[readonly] { background: #f1f3f5; }
    .newsletter { display: flex; gap: 20px; align-items: center; margin: 10px 0 18px; }
    .newsletter label, .agree { display: inline-flex; gap: 7px; align-items: center; }
    .newsletter input, .agree input { width: auto; height: auto; }
    .agree { margin: 14px 0; }
    input[type="submit"] { padding: 9px 16px; color: #fff; background: #1769aa; border: 0; border-radius: 4px; cursor: pointer; }
    .alert { padding: 12px 16px; margin: 0 0 18px; border: 1px solid transparent; border-radius: 4px; }
    .alert-danger { color: #842029; background: #f8d7da; border-color: #f5c2c7; }
    .muted { color: #56616f; }
    #clear-label { cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1 id="assertion-heading" class="page-title h3">Playwright assertion practice</h1>

  <main>
    <section class="panel" aria-label="Registration">
      <div id="registration-warning" class="alert alert-danger alert-dismissible" role="alert" hidden>
        Warning: You must agree to the Privacy Policy!
      </div>
      <p class="muted">If you already have an account with us, please login at the login page.</p>

      <form id="register-form" novalidate>
        <h2>Your Personal Details</h2>
        <div class="field">
          <label for="input-firstname">First Name</label>
          <input class="form-control" id="input-firstname" name="firstname" type="text">
        </div>
        <div class="field">
          <label for="input-lastname">Last Name</label>
          <input class="form-control" id="input-lastname" name="lastname" type="text">
        </div>
        <div class="field">
          <label for="input-email">E-Mail</label>
          <input class="form-control" id="input-email" name="email" type="email">
        </div>
        <div class="field">
          <label for="input-telephone">Telephone</label>
          <input class="form-control" id="input-telephone" name="telephone" type="tel">
        </div>

        <h2>Your Password</h2>
        <div class="field">
          <label for="input-password">Password</label>
          <input class="form-control" id="input-password" name="password" type="password">
        </div>
        <div class="field">
          <label for="input-confirm">Password Confirm</label>
          <input class="form-control" id="input-confirm" name="confirm" type="password">
        </div>

        <h2>Newsletter</h2>
        <div>Subscribe</div>
        <div class="newsletter">
          <label><input id="input-newsletter-yes" name="newsletter" type="radio" value="1"> Yes</label>
          <label><input id="input-newsletter-no" name="newsletter" type="radio" value="0" checked> No</label>
        </div>

        <label class="agree" for="input-agree">
          <input id="input-agree" name="agree" type="checkbox">
          <span>I have read and agree to the Privacy Policy</span>
        </label>
        <div><input type="submit" value="Continue"></div>
      </form>
    </section>

    <section class="panel" aria-label="Edit fields">
      <h2>Edit Fields</h2>
      <div class="field">
        <label for="fullName">Enter first &amp; last name</label>
        <input class="practice-input" id="fullName" type="text" placeholder="Enter first &amp; last name" value="">
      </div>
      <div class="field">
        <label for="join">Append a text and press keyboard tab</label>
        <input class="practice-input" id="join" type="text" value="I am good">
      </div>
      <div class="field">
        <label for="getMe">What is inside the text box</label>
        <input class="practice-input" id="getMe" type="text" value="ortonikc">
      </div>
      <div class="field">
        <label id="clear-label" for="clearMe">Clear the text</label>
        <input class="practice-input" id="clearMe" type="text" value="Koushik Chatterjee">
      </div>
      <div class="field">
        <label for="noEdit">Confirm edit field is disabled</label>
        <input class="practice-input" id="noEdit" type="text" disabled>
      </div>
      <div class="field">
        <label for="dontwrite">Confirm text is readonly</label>
        <input class="practice-input" id="dontwrite" type="text" value="This text is readonly" readonly>
      </div>
    </section>

    <a href="#playwright-start" id="get-started">Get started</a>
    <span id="playwright-start" class="muted">Practice page content</span>
  </main>

  <script>
    // The supplied script reloads this page once per step.
    // Visit 16 and visit 20 need different text on the same single h1.
    const counterKey = 'assertionFixtureVisit';
    let visit = Number(sessionStorage.getItem(counterKey) || '0') + 1;
    if (visit > 20) visit = 1;
    sessionStorage.setItem(counterKey, String(visit));

    const heading = document.getElementById('assertion-heading');
    if (visit === 16) {
      heading.textContent = 'Synthetic Page Server Tester';
    } else {
      heading.textContent = 'Playwright assertion practice';
    }

    document.getElementById('register-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const warning = document.getElementById('registration-warning');
      warning.hidden = document.getElementById('input-agree').checked;
      if (!warning.hidden) warning.scrollIntoView({ block: 'nearest' });
    });

    document.getElementById('clear-label').addEventListener('click', () => {
      document.getElementById('clearMe').value = '';
    });
  </script>
</body>
</html>
