<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synthetic Page Server Tester</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #24313f; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 16px 48px; }
    main { max-width: 820px; margin: 0 auto; }
    h1 { margin: 0 0 10px; font-size: 28px; }
    h2 { margin: 26px 0 12px; font-size: 20px; }
    .panel { margin: 18px 0; padding: 20px; background: #fff; border: 1px solid #d6dee8; border-radius: 8px; }
    label { display: block; margin-bottom: 8px; }
    select { min-width: 240px; padding: 8px; }
    .checkbox-row { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
    .checkbox-row input { width: 18px; height: 18px; }
    #clear-label { cursor: pointer; }
    input[type="text"] { display: block; width: 100%; max-width: 420px; height: 38px; padding: 8px 10px; border: 1px solid #aeb9c6; border-radius: 4px; }
    .hint { color: #56616f; }
  </style>
</head>
<body>
  <main>
    <h1>Synthetic Page Server Tester</h1>

    <section class="panel" aria-labelledby="dropdown-heading">
      <h2 id="dropdown-heading">Drop-Down</h2>
      <label for="superheros">Select superheroes</label>
      <select id="superheros" name="superheros" multiple size="5">
        <option value="bt">Batman</option>
        <option value="dd">Daredevil</option>
        <option value="sp">Spiderman</option>
        <option value="ww">Wonder Woman</option>
        <option value="aq">Aquaman</option>
      </select>
    </section>

    <section class="panel" aria-labelledby="edit-heading">
      <h2 id="edit-heading">Edit Fields</h2>
      <label id="clear-label" for="clearMe">Clear the text</label>
      <input id="clearMe" type="text" value="Sample text">
    </section>

    <section class="panel" aria-labelledby="checkbox-heading">
      <h2 id="checkbox-heading">Sports</h2>
      <label class="checkbox-row">
        <input id="cricket" type="checkbox" name="sports" value="cricket" checked>
        <span>Cricket</span>
      </label>
      <label class="checkbox-row">
        <input id="football" type="checkbox" name="sports" value="football">
        <span>Football</span>
      </label>
    </section>

    <p class="hint">Single-page fixture for the supplied assertion examples.</p>
  </main>

  <script>
    document.getElementById('clear-label').addEventListener('click', () => {
      document.getElementById('clearMe').value = '';
    });
  </script>
</body>
</html>
