<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single iFrame Layer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #e9ecef;
            font-family: Arial, sans-serif;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: 2px dashed #007bff;
            border-radius: 8px;
            background-color: white;
        }
    </style>
</head>
<body>
    <h3>Single iFrame Layer (Loads login.html)</h3>
    <iframe src="login.html" title="Login iFrame"></iframe>
</body>
</html>
