<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested iFrame Wrapper</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;
        }
        iframe {
            width: 100%;
            height: 700px;
            border: 3px solid #0288d1;
            border-radius: 10px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <h2>Top Level Container (xy-iframe-2.html)</h2>
    <p>Nested Hierarchy: <strong>xy-iframe-2.html</strong> &gt; <strong>xy-iframe-1.html</strong> &gt; <strong>up1.html</strong></p>
    
    <iframe src="xy-iframe-1.html" title="Nested iFrame Level 1"></iframe>

</html>
