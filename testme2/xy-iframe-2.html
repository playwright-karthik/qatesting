<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested iFrame Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #d1ecf1;
            font-family: Arial, sans-serif;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: 3px solid #17a2b8;
            border-radius: 10px;
            background-color: white;
        }
    </style>
</head>
<body>
    <h2>Outer Page (Top Level)</h2>
    <p>Below is a nested iframe structure: <strong>Parent Page → iframe1.html → login.html</strong></p>
    
    <!-- Nested iframe loading iframe1.html, which in turn loads login.html -->
    <iframe src="iframe1.html" title="Nested iFrame Container"></iframe>
</body>
</html>
